name: Release DMG

# When a release is published, build DropS3.app (Apple Silicon + Intel),
# pack it into a .dmg and attach it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build app and DMG
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
        run: |
          export VERSION="${TAG#v}"     # v1.2.0 -> 1.2.0
          ./make-dmg.sh
          ls -lh dist/*.dmg

      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.dmg --clobber
